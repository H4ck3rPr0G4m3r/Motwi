name: packaging

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            extension/package-lock.json

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        run: uv run --project core --group packaging python packaging/build.py

      - name: Install, launch, quit and uninstall it
        run: uv run --project core python packaging/test_install.py

      - uses: actions/upload-artifact@v4
        with:
          name: motwi-installer
          path: |
            packaging/out/Motwi-Setup-*.exe
            packaging/out/Motwi-extension-*.zip
          if-no-files-found: error
