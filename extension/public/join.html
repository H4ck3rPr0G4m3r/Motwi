<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Join Motwi</title>
    <style>
      @font-face {
        font-family: "Motwi Inter";
        font-weight: 400;
        src: url("fonts/inter-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Motwi Inter";
        font-weight: 600;
        src: url("fonts/inter-latin-600-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Motwi Mono";
        font-weight: 600;
        src: url("fonts/jetbrains-mono-latin-600-normal.woff2") format("woff2");
      }
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #0f0f12;
        color: #efeff1;
        font: 400 14px/1.5 "Motwi Inter", "Segoe UI", system-ui, sans-serif;
      }
      #app {
        width: min(460px, calc(100vw - 32px));
        padding: 24px;
        background: #18181b;
        border: 1px solid #2a2a30;
        border-radius: 6px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
      }
      .logo {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: #4fd1b5;
        color: #06231d;
        font-weight: 700;
        display: grid;
        place-items: center;
      }
      h1 {
        margin: 16px 0 6px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 10px;
        color: #adadb8;
      }
      .mono {
        font-family: "Motwi Mono", ui-monospace, monospace;
        font-weight: 600;
      }
      .code {
        margin: 14px 0;
        font-size: 26px;
        letter-spacing: 0.08em;
        color: #efeff1;
      }
      .bad {
        color: #f0646a;
      }
      .address {
        margin: 14px 0 0;
        font-size: 12px;
        color: #8f8f99;
        overflow-wrap: anywhere;
      }
      .address .mono {
        font-size: 11.5px;
      }
      .action {
        display: inline-flex;
        align-items: center;
        height: 32px;
        padding: 0 14px;
        margin-top: 4px;
        border: 0;
        border-radius: 4px;
        background: #4fd1b5;
        color: #06231d;
        font: inherit;
        font-weight: 600;
        font-size: 13px;
        text-decoration: none;
        cursor: pointer;
      }
      .action:hover {
        background: #6adcc3;
      }
      .action:active {
        transform: translateY(1px);
      }
      .action.quiet {
        background: #2f2f35;
        color: #efeff1;
      }
      .action.quiet:hover {
        background: #3a3a42;
      }
      :focus-visible {
        outline: 2px solid #4fd1b5;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="join.js"></script>
  </body>
</html>
